version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobspri
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: ["./backend:/app"]
    env_file: .env.example
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    command: npm run dev
    volumes: ["./frontend:/app"]
    env_file: .env.example
    depends_on: [backend]
    ports: ["3000:3000"]
